name: Android E2E Appium Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Using ubuntu-latest for reliable x86_64 KVM hardware acceleration
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 3. Setup k6
        uses: grafana/setup-k6-action@v1

      - name: 4. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true

      - name: 5. Verify Node 22 Environment
        run: |
          echo "Node version:"
          node --version
          echo "NPM version:"
          npm --version
          echo "Node path:"
          which node

      - name: 6. Install and Verify Appium
        run: |
          npm install appium@latest
          echo "Appium version:"
          npx appium --version
          npx appium driver install uiautomator2

      - name: 6. Build REAL APK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: wrapper
          cache-read-only: false

      - name: 6.1 Build REAL APK
        working-directory: ./android-app
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleDebug

      - name: 7. Start Appium Server
        run: |
          npx appium --log-level error --log appium.log &
          
          echo "Waiting for Appium server to start..."
          timeout 30 bash -c 'until curl -s http://127.0.0.1:4723/status; do sleep 2; done' || { echo "Appium failed to start"; cat appium.log; exit 1; }
          echo "Appium server is ready."

      - name: 7.5 Start Backend and Frontend
        run: |
          pip install -r backend/requirements.txt
          python -m uvicorn main:app --host 127.0.0.1 --port 8080 --app-dir backend > uvicorn.log 2>&1 &
          npx serve -s . -l 3000 > serve.log 2>&1 &
          sleep 8
          curl -I http://127.0.0.1:8080/ || { echo "FastAPI failed to start"; cat uvicorn.log; exit 1; }

      - name: 7.9 Create Test Script
        run: |
          cat << 'EOF' > run_tests.sh
          #!/bin/bash
          set -e
          
          echo "Emulator booted successfully. Verifying ADB devices..."
          adb devices
          
          echo "Waiting for Android system to be fully ready..."
          WAIT_TIMEOUT=120
          while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
            WAIT_TIMEOUT=$((WAIT_TIMEOUT-1))
            if [ $WAIT_TIMEOUT -eq 0 ]; then
              echo "ERROR: Android emulator failed to become fully ready in time!"
              exit 1
            fi
            sleep 1
          done
          echo "Android system is ready!"
          
          echo "Finding APK..."
          export ACTUAL_APK_PATH=$(find $GITHUB_WORKSPACE/android-app/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          echo "Found APK at: $ACTUAL_APK_PATH"
          
          if [ -z "$ACTUAL_APK_PATH" ]; then
            echo "APK not found! Failing build."
            exit 1
          fi
          
          echo "Running baseline load testing with k6..."
          if [ -f "Vulnerability Test Results/k6-load-test.js" ]; then
            k6 run "Vulnerability Test Results/k6-load-test.js"
          else
            echo "k6 load test script not found, skipping."
          fi
          
          echo "Executing Maven E2E Test Suite..."
          cd automation
          chmod +x ./mvnw || true
          ./mvnw clean test -Dapk.path="$ACTUAL_APK_PATH" -Dappium.url="http://127.0.0.1:4723" -DdeviceName="emulator-5554" -Dudid="emulator-5554"
          EOF
          chmod +x run_tests.sh

      - name: 8. Boot Emulator & Run Real Tests
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 25
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 600
          disable-animations: true
          script: ./run_tests.sh

      - name: 9. Upload Real Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Automation-Reports
          path: |
            automation/test-output/
            automation/reports/
            automation/screenshots/
            automation/logs/
            appium.log
          retention-days: 30
          if-no-files-found: ignore
