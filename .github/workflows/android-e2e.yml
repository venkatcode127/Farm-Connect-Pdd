name: Android Appium E2E Automation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'  # Daily execution at 02:00 UTC

env:
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: 34
  ANDROID_BUILD_TOOLS: '34.0.0'
  EMULATOR_NAME: 'nexus_6_api34'
  NODE_VERSION: '20'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  android-e2e-tests:
    name: "Android Appium E2E Automation Pipeline"
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # ==================== STAGE 1: Checkout Repository ====================
      - name: "Stage 1: Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==================== STAGE 2: Setup Java ====================
      - name: "Stage 2: Setup Java ${{ env.JAVA_VERSION }}"
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      # ==================== STAGE 3: Setup Node.js ====================
      - name: "Stage 3: Setup Node.js ${{ env.NODE_VERSION }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # ==================== STAGE 4: Setup Android SDK ====================
      - name: "Stage 4: Setup Android SDK"
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}

      # ==================== STAGE 5: Install Android Dependencies ====================
      - name: "Stage 5: Install Android Dependencies & Tools"
        run: |
          echo "Installing required Android SDK components..."
          sdkmanager --install "platform-tools" \
            "platforms;android-${{ env.ANDROID_API_LEVEL }}" \
            "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
            "system-images;android-${{ env.ANDROID_API_LEVEL }};google_apis;x86_64" \
            "emulator"
          sdkmanager --licenses <<< "y" || true

      # ==================== STAGE 6: Copy Web Assets & Build Debug APK ====================
      - name: "Stage 6: Build Android APK from android-app"
        run: |
          echo "=========================================="
          echo "Copying web assets into Android project..."
          echo "=========================================="
          mkdir -p android-app/app/src/main/assets
          cp index.html android-app/app/src/main/assets/
          cp styles.css android-app/app/src/main/assets/
          cp app.js android-app/app/src/main/assets/
          cp auth.js android-app/app/src/main/assets/
          cp data.js android-app/app/src/main/assets/
          cp chat.js android-app/app/src/main/assets/
          cp orders.js android-app/app/src/main/assets/
          cp predict.js android-app/app/src/main/assets/
          cp mandi_api.js android-app/app/src/main/assets/
          cp manifest.json android-app/app/src/main/assets/

          echo "Building APK via Gradle..."
          cd android-app
          chmod +x gradlew 2>/dev/null || true

          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper --gradle-version 8.4
            chmod +x gradlew
          fi

          ./gradlew assembleDebug --stacktrace

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::APK build failed: $APK_PATH not found!"
            exit 1
          fi

          echo "APK built successfully at: $APK_PATH"
          ls -lh "$APK_PATH"

      # ==================== STAGE 7-11: Start Emulator, Verify, Install APK, Start Appium & Run Tests ====================
      - name: "Stage 7-11: Start Emulator, Start Appium & Execute Tests"
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -e

            echo "=========================================="
            echo "Stage 7: Verifying emulator readiness..."
            echo "=========================================="
            adb wait-for-device
            adb shell getprop sys.boot_completed | grep -m 1 '1'
            adb shell input keyevent 82
            echo "Android Emulator is ready and unlocked!"

            echo "Starting continuous logcat capture..."
            mkdir -p automation/test-output/logs
            adb logcat -v time > automation/test-output/logs/device_logcat.log 2>&1 &
            LOGCAT_PID=$!

            echo "=========================================="
            echo "Stage 8: Installing APK on emulator..."
            echo "=========================================="
            APK_FILE="android-app/app/build/outputs/apk/debug/app-debug.apk"
            if ! adb install -r "$APK_FILE"; then
              echo "::error::Failed to install APK onto emulator!"
              exit 1
            fi
            echo "APK installed successfully!"

            echo "=========================================="
            echo "Stage 9: Installing and Starting Appium Server..."
            echo "=========================================="
            npm install -g appium@latest
            appium driver install uiautomator2 || true
            appium --address 127.0.0.1 --port 4723 --relaxed-security --log-timestamp --log automation/test-output/logs/appium.log &
            APPIUM_PID=$!
            echo "Appium Server launched with PID: $APPIUM_PID"

            echo "=========================================="
            echo "Stage 10: Verifying Appium Server health..."
            echo "=========================================="
            APPIUM_READY=false
            for i in $(seq 1 30); do
              if curl -s http://127.0.0.1:4723/status | grep -q '"ready":true'; then
                echo "Appium server is healthy and ready!"
                APPIUM_READY=true
                break
              fi
              echo "Waiting for Appium server... (attempt $i/30)"
              sleep 2
            done

            if [ "$APPIUM_READY" != "true" ]; then
              echo "::error::Appium server failed health check within 60 seconds!"
              kill $APPIUM_PID 2>/dev/null || true
              exit 1
            fi

            echo "=========================================="
            echo "Stage 11: Executing Appium TestNG E2E Tests..."
            echo "=========================================="
            cd automation
            mvn clean test \
              -Dappium.url=http://127.0.0.1:4723 \
              -Dapk.path=../android-app/app/build/outputs/apk/debug/app-debug.apk \
              -DtestFailureIgnore=true \
              --batch-mode

            echo "Test suite execution completed."

            # Cleanup background processes
            kill $APPIUM_PID 2>/dev/null || true
            kill $LOGCAT_PID 2>/dev/null || true

      # ==================== STAGE 12-17: Collect and Consolidate Reports ====================
      - name: "Stage 12-17: Organize and Consolidate Test Results"
        if: always()
        run: |
          echo "Consolidating all reports and artifacts..."
          
          # Create both standard directory structures: "Test Results" and "test-results"
          for BASE_DIR in "test-results" "Test Results"; do
            mkdir -p "$BASE_DIR/Excel"
            mkdir -p "$BASE_DIR/HTML"
            mkdir -p "$BASE_DIR/JSON"
            mkdir -p "$BASE_DIR/Summary"
            mkdir -p "$BASE_DIR/Screenshots"
            mkdir -p "$BASE_DIR/Logs"

            # Copy Excel reports
            cp -r automation/test-output/reports/Excel/* "$BASE_DIR/Excel/" 2>/dev/null || true
            
            # Copy HTML reports
            cp -r automation/test-output/reports/HTML/* "$BASE_DIR/HTML/" 2>/dev/null || true
            
            # Copy JSON reports
            cp -r automation/test-output/reports/JSON/* "$BASE_DIR/JSON/" 2>/dev/null || true
            
            # Copy Markdown summary
            cp -r automation/test-output/reports/Summary/* "$BASE_DIR/Summary/" 2>/dev/null || true
            
            # Copy Screenshots
            cp -r automation/test-output/screenshots/* "$BASE_DIR/Screenshots/" 2>/dev/null || true
            
            # Copy Logs
            cp -r automation/test-output/logs/* "$BASE_DIR/Logs/" 2>/dev/null || true
          done

          # Capture latest adb logcat dump if not already present (timeout after 5s if emulator not running)
          timeout 5s adb logcat -d > test-results/Logs/device_logcat_dump.log 2>/dev/null || true
          cp test-results/Logs/device_logcat_dump.log "Test Results/Logs/" 2>/dev/null || true

          echo "All test reports structured successfully!"
          ls -la test-results/

      # ==================== STAGE 18: Upload Artifacts ====================
      - name: "Stage 18: Upload Test Artifacts (30 Days Retention)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results-build-${{ github.run_number }}
          path: |
            test-results/
            Test Results/
            automation/test-output/
          retention-days: 30

      # ==================== STAGE 19-20: Deploy Reports to GitHub Pages ====================
      - name: "Stage 19-20: Prepare GitHub Pages Deployment & History"
        if: always()
        run: |
          mkdir -p pages-deploy/reports/latest
          mkdir -p pages-deploy/reports/history/build-${{ github.run_number }}

          # Copy latest HTML reports
          cp -r test-results/HTML/* pages-deploy/reports/latest/ 2>/dev/null || true
          mkdir -p pages-deploy/reports/latest/screenshots
          mkdir -p pages-deploy/reports/latest/logs
          cp -r test-results/Screenshots/* pages-deploy/reports/latest/screenshots/ 2>/dev/null || true
          cp -r test-results/Logs/* pages-deploy/reports/latest/logs/ 2>/dev/null || true
          cp test-results/Summary/summary.md pages-deploy/reports/latest/ 2>/dev/null || true

          # Preserve historical archive for this build
          cp -r test-results/HTML/* pages-deploy/reports/history/build-${{ github.run_number }}/ 2>/dev/null || true
          cp test-results/Summary/summary.md pages-deploy/reports/history/build-${{ github.run_number }}/ 2>/dev/null || true

          # Create portal redirect index
          cat > pages-deploy/index.html << 'INDEX_EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta http-equiv="refresh" content="0;url=reports/latest/execution-report.html">
            <title>FarmConnect AI - Test Reports</title>
            <style>
              body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
              .card { background: #1e293b; padding: 2rem; border-radius: 16px; text-align: center; border: 1px solid #334155; }
              a { color: #10b981; text-decoration: none; font-weight: 600; }
            </style>
          </head>
          <body>
            <div class="card">
              <h2>🌾 FarmConnect AI - Test Reports Portal</h2>
              <p>Redirecting to <a href="reports/latest/execution-report.html">Latest Execution Report</a>...</p>
            </div>
          </body>
          </html>
          INDEX_EOF

      - name: "Stage 20: Deploy Reports to GitHub Pages"
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages-deploy
          keep_files: true

      # ==================== STAGE 21: GitHub Actions Job Summary ====================
      - name: "Stage 21: Publish GitHub Actions Job Summary"
        if: always()
        run: |
          echo "# 🌾 FarmConnect AI — Android Appium E2E Automation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          JSON_FILE="test-results/JSON/execution-results.json"
          EXEC_DATE=$(date -u '+%Y-%m-%d %H:%M:%S UTC')

          echo "### 📋 Pipeline & Environment Details" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Number** | \`#${{ github.run_number }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Execution Date** | \`$EXEC_DATE\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Git Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **APK Version** | \`1.0.0\` (debug) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Device** | \`Nexus 6 (Android Emulator)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Android Version** | \`14 (API 34)\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Automation Framework** | \`Appium 9.1 + TestNG 7.9 + UiAutomator2\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "$JSON_FILE" ]; then
            TOTAL=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d['summary'].get('totalTests', 0))" 2>/dev/null || echo "0")
            EXECUTED=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d['summary'].get('executed', 0))" 2>/dev/null || echo "0")
            PASSED=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d['summary'].get('passed', 0))" 2>/dev/null || echo "0")
            FAILED=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d['summary'].get('failed', 0))" 2>/dev/null || echo "0")
            SKIPPED=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d['summary'].get('skipped', 0))" 2>/dev/null || echo "0")
            BLOCKED=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d['summary'].get('blocked', 0))" 2>/dev/null || echo "0")
            PASS_RATE=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d['summary'].get('passRate', 0))" 2>/dev/null || echo "0")
            FAIL_RATE=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d['summary'].get('failRate', 0))" 2>/dev/null || echo "0")
            DURATION=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d['summary'].get('executionDurationSec', '0'))" 2>/dev/null || echo "0")

            echo "### 📊 Execution Metrics" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Count / Value | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|---------------|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| **Total Test Cases** | **$TOTAL** | 📦 |" >> $GITHUB_STEP_SUMMARY
            echo "| **Executed** | **$EXECUTED** | ⚡ |" >> $GITHUB_STEP_SUMMARY
            echo "| **Passed** | **$PASSED** | ✅ |" >> $GITHUB_STEP_SUMMARY
            echo "| **Failed** | **$FAILED** | ❌ |" >> $GITHUB_STEP_SUMMARY
            echo "| **Skipped** | **$SKIPPED** | ⏭️ |" >> $GITHUB_STEP_SUMMARY
            echo "| **Blocked** | **$BLOCKED** | 🚫 |" >> $GITHUB_STEP_SUMMARY
            echo "| **Pass Percentage** | **${PASS_RATE}%** | $( [ "$(echo "$PASS_RATE >= 95.0" | bc -l 2>/dev/null || echo 0)" = "1" ] && echo "🟢 Meets Quality Gate" || echo "🔴 Below Threshold" ) |" >> $GITHUB_STEP_SUMMARY
            echo "| **Fail Percentage** | **${FAIL_RATE}%** | 📉 |" >> $GITHUB_STEP_SUMMARY
            echo "| **Execution Duration** | **${DURATION}s** | ⏱️ |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Print passed test cases inside collapsible section
            echo "<details><summary><b>✅ Passed Test Cases ($PASSED)</b></summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            python3 -c "
import json
d = json.load(open('$JSON_FILE'))
for t in d.get('testResults', []):
    if t.get('status') == 'PASS':
        print(f\"- ✓ **{t.get('testId','')}** - \`{t.get('testName','')}\` ({t.get('module','')})\")
" >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Print failed test cases
            echo "<details><summary><b>❌ Failed Test Cases ($FAILED)</b></summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$FAILED" = "0" ]; then
              echo "*No test failures!*" >> $GITHUB_STEP_SUMMARY
            else
              python3 -c "
import json
d = json.load(open('$JSON_FILE'))
for t in d.get('testResults', []):
    if t.get('status') == 'FAIL':
        print(f\"- ✗ **{t.get('testId','')}** - \`{t.get('testName','')}\` ({t.get('module','')})\")
        print(f\"  - Reason: \`{t.get('failureReason','Unknown')}\`\")
" >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Print skipped test cases
            echo "<details><summary><b>⏭️ Skipped Test Cases ($SKIPPED)</b></summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ "$SKIPPED" = "0" ]; then
              echo "*No skipped tests.*" >> $GITHUB_STEP_SUMMARY
            else
              python3 -c "
import json
d = json.load(open('$JSON_FILE'))
for t in d.get('testResults', []):
    if t.get('status') == 'SKIP':
        print(f\"- ⊘ **{t.get('testId','')}** - \`{t.get('testName','')}\` ({t.get('module','')})\")
" >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY

          else
            echo "⚠️ \`execution-results.json\` was not found." >> $GITHUB_STEP_SUMMARY
          fi

      # ==================== STAGE 22: Quality Gate Enforcement ====================
      - name: "Stage 22: Enforce Quality Gate Threshold"
        if: always()
        run: |
          echo "=========================================="
          echo "Evaluating Quality Gate Policies..."
          echo "=========================================="
          JSON_FILE="test-results/JSON/execution-results.json"
          
          if [ ! -f "$JSON_FILE" ]; then
            echo "::error::Test results JSON missing. Failing build as quality gate cannot be verified!"
            exit 1
          fi

          PASS_RATE=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d['summary'].get('passRate', 0))" 2>/dev/null || echo "0")
          CRITICAL_FAIL_RATE=$(python3 -c "import json; d=json.load(open('$JSON_FILE')); print(d['summary'].get('criticalFailRate', 0))" 2>/dev/null || echo "0")
          
          echo "Overall Pass Rate: ${PASS_RATE}% (Requirement: >= 95.0%)"
          echo "Critical Tests Fail Rate: ${CRITICAL_FAIL_RATE}% (Requirement: <= 5.0%)"

          GATE_FAILED=false

          if [ "$(echo "$PASS_RATE < 95.0" | bc -l 2>/dev/null || echo 0)" = "1" ]; then
            echo "::error::Quality Gate Failed: Pass rate ${PASS_RATE}% is below mandatory threshold of 95.0%!"
            GATE_FAILED=true
          fi

          if [ "$(echo "$CRITICAL_FAIL_RATE > 5.0" | bc -l 2>/dev/null || echo 0)" = "1" ]; then
            echo "::error::Quality Gate Failed: Critical failure rate ${CRITICAL_FAIL_RATE}% exceeds maximum allowable threshold of 5.0%!"
            GATE_FAILED=true
          fi

          if [ "$GATE_FAILED" = "true" ]; then
            exit 1
          fi

          echo "✅ All Quality Gate thresholds satisfied!"
