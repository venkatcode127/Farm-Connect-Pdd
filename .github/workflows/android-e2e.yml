name: Android E2E Appium Automation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Using ubuntu-latest for reliable x86_64 KVM hardware acceleration
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 3. Install System Dependencies (Maven & k6)
        run: |
          brew install maven
          brew install k6
          mvn --version

      - name: 4. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true

      - name: 5. Verify Node 22 Environment
        run: |
          echo "Node version:"
          node --version
          echo "NPM version:"
          npm --version
          echo "Node path:"
          which node

      - name: 6. Install and Verify Appium
        run: |
          npm install -g appium@latest
          echo "Appium path:"
          which appium
          echo "Appium shebang:"
          head -n 1 "$(which appium)" || true
          echo "Appium version:"
          appium --version
          appium driver install uiautomator2

      - name: 6. Build REAL APK
        working-directory: ./android-app
        run: |
          chmod +x ./gradlew || true
          ./gradlew assembleDebug

      - name: 7. Start Appium Server
        run: |
          appium --log-level error --log appium.log &

      - name: 8. Boot Emulator & Run Real Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 600
          disable-animations: true
          script: |
            echo "Emulator booted successfully. Verifying ADB devices..."
            adb devices
            
            echo "Verifying boot status..."
            BOOT_STATUS=$(adb shell getprop sys.boot_completed | tr -d '\r')
            echo "sys.boot_completed = $BOOT_STATUS"
            if [ "$BOOT_STATUS" != "1" ]; then
              echo "Emulator boot_completed is not 1! Failing."
              exit 1
            fi
            echo "Emulator is verified and fully responsive."
            
            echo "Finding APK..."
            export ACTUAL_APK_PATH=$(find $GITHUB_WORKSPACE/android-app/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
            echo "Found APK at: $ACTUAL_APK_PATH"
            
            if [ -z "$ACTUAL_APK_PATH" ]; then
              echo "APK not found! Failing build."
              exit 1
            fi
            
            echo "Running baseline load testing with k6..."
            if [ -f "Vulnerability Test Results/k6-load-test.js" ]; then
              k6 run "Vulnerability Test Results/k6-load-test.js"
            else
              echo "k6 load test script not found, skipping."
            fi
            
            echo "Executing Maven E2E Test Suite..."
            cd automation
            mvn clean test -Dapk.path="$ACTUAL_APK_PATH" -Dappium.url="http://127.0.0.1:4723" -DdeviceName="emulator-5554" -Dudid="emulator-5554"

      - name: 9. Upload Real Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Automation-Reports
          path: |
            automation/test-output/
            automation/reports/
            automation/screenshots/
            automation/logs/
            appium.log
          retention-days: 30
          if-no-files-found: ignore
