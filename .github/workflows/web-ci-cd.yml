name: Web Application CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # ==================== JOB 1: Lint & Code Quality ====================
  lint-and-validate:
    name: Lint & Code Quality Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache-dependency-path: '**/package-lock.json'

      - name: Validate JavaScript Syntax
        run: |
          echo "Checking JavaScript syntax for errors..."
          node --check app.js
          node --check auth.js
          node --check chat.js
          node --check data.js
          node --check mandi_api.js
          node --check orders.js
          node --check predict.js
          echo "All JavaScript files passed syntax verification!"

      - name: Validate HTML Structure
        run: |
          echo "Validating HTML structure..."
          npx -y htmlhint index.html || true
          echo "HTML validation check complete."

      - name: Verify Web Assets Integrity
        run: |
          echo "Verifying required web assets exist..."
          for file in index.html styles.css app.js auth.js chat.js data.js mandi_api.js orders.js predict.js manifest.json; do
            if [ ! -f "$file" ]; then
              echo "Error: Required asset $file is missing!"
              exit 1
            fi
            echo "✓ Found $file ($(wc -c < "$file") bytes)"
          done

  # ==================== JOB 2: Build & Package ====================
  build-web-package:
    name: Build & Package Web Application
    needs: lint-and-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Web Distribution Bundle
        run: |
          echo "Packaging FarmConnect Web application..."
          mkdir -p dist
          cp index.html styles.css app.js auth.js chat.js data.js mandi_api.js orders.js predict.js manifest.json dist/
          cp -r assets dist/ 2>/dev/null || true
          cp -r icons dist/ 2>/dev/null || true
          ls -la dist/

      - name: Upload Web Application Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: farmconnect-web-bundle-${{ github.sha }}
          path: dist/
          retention-days: 30

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./

  # ==================== JOB 3: Deploy to GitHub Pages ====================
  deploy-github-pages:
    name: Deploy Web App to GitHub Pages
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build-web-package
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
