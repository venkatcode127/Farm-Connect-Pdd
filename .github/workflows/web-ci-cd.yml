name: Web Application CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build React & Test FastAPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # --- Setup Backend (Python/FastAPI) ---
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install httpx pytest # For testing

      - name: Verify FastAPI Syntax
        run: |
          cd backend
          python -m py_compile main.py models.py database.py

      # --- Setup Frontend (Node/React/Vite) ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build React Application
        run: |
          cd frontend
          npm run build

      - name: Verify Build Output
        run: |
          if [ ! -d "frontend/dist" ]; then
            echo "Error: frontend/dist directory not found! Build failed."
            exit 1
          fi
          echo "React build successful. Dist contents:"
          ls -la frontend/dist/

      # --- Package and Upload ---
      - name: Upload Web Application Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: farmconnect-web-bundle-${{ github.sha }}
          path: frontend/dist/
          retention-days: 30

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/

  deploy-github-pages:
    name: Deploy Web App to GitHub Pages
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
