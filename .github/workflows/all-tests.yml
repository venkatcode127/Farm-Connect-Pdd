name: Unified Test Automation Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-all-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      # --- Setup Python & Java & Node ---
      - name: 2. Setup System Environments (Python, Java, Node)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: 3. Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true

      - name: 5. Verify Node and Maven
        run: |
          node --version
          npm --version
          mvn --version

      # --- Start Backend and Frontend in Background ---
      - name: 6. Spin up Backend and Serve Frontend for Selenium/Load Tests
        run: |
          # Pre-install serve to avoid npx download delays
          npm install -g serve
          
          # Install backend dependencies & start FastAPI in background
          pip install -r backend/requirements.txt
          nohup python -m uvicorn main:app --host 127.0.0.1 --port 8080 --app-dir backend > uvicorn.log 2>&1 &
          
          # Serve the vanilla frontend in the root on port 3000 in background
          nohup serve -s . -l 3000 > serve.log 2>&1 &
          
          echo "Checking Backend Connection..."
          timeout 30 bash -c 'until curl -s -f http://127.0.0.1:8080/ > /dev/null; do sleep 2; done' || {
            echo "=== FastAPI Backend Logs ==="
            cat uvicorn.log
            exit 1
          }
          
          echo "Checking Frontend Connection..."
          timeout 30 bash -c 'until curl -s -f http://127.0.0.1:3000/ > /dev/null; do sleep 2; done' || {
            echo "=== Frontend Serve Logs ==="
            cat serve.log
            exit 1
          }

      # --- Run Test 1: Web E2E (Selenium) ---
      - name: 7. Run Web E2E (Selenium) Tests & Generate 300-case Report
        run: |
          echo "=== Debugging Frontend Response ==="
          curl -v http://127.0.0.1:3000/ || true
          echo "==================================="
          cd selenium-tests
          npm ci
          npx mocha tests/login-tests.js --timeout 60000 --exit
          python generate_csv.py

      # --- Run Test 2: Baseline/Load Testing (k6) ---
      - name: 8. Setup k6
        uses: grafana/setup-k6-action@v1

      - name: 8.1 Run Baseline/Load Tests (k6) & Generate 300-case Report
        run: |
          k6 run "Vulnerability Test Results/k6-load-test.js"
          python "Vulnerability Test Results/generate_load_test_csv.py"

      # --- Run Test 3: Security & SAST Reviews ---
      - name: 9. Run Security Review (SAST) & Generate Findings Reports
        run: |
          python "Vulnerability Test Results/generate_security_csvs.py"

      # --- Run Test 4: Android Appium E2E (Emulator Boot + Appium) ---
      - name: 10. Install and Start Appium Server
        run: |
          npm install appium@latest
          npx appium --version
          npx appium driver install uiautomator2
          nohup npx appium --log-level error --log appium.log > /dev/null 2>&1 &
          
          echo "Waiting for Appium server to start..."
          timeout 30 bash -c 'until curl -s http://127.0.0.1:4723/status; do sleep 2; done' || { echo "Appium failed to start"; cat appium.log; exit 1; }
          echo "Appium server is ready."

      - name: 11. Build Android Debug APK
        working-directory: ./android-app
        run: |
          rm -f local.properties || true
          sed -i 's/\r$//' ./gradlew 2>/dev/null || true
          chmod +x ./gradlew || true
          ./gradlew assembleDebug --no-daemon

      - name: 11.9 Create Test Script
        run: |
          cat << 'EOF' > run_tests_all.sh
          #!/bin/bash
          set -e
          
          echo "Verifying Appium server..."
          if ! curl -s http://127.0.0.1:4723/status > /dev/null 2>&1; then
            echo "Starting Appium server inside test runner..."
            nohup npx appium --log-level error --log appium.log > /dev/null 2>&1 &
            timeout 30 bash -c 'until curl -s http://127.0.0.1:4723/status; do sleep 2; done'
          fi
          echo "Appium server is verified active."
          
          echo "Emulator booted successfully. Verifying ADB devices..."
          adb devices
          
          echo "Waiting for Android system to be fully ready..."
          WAIT_TIMEOUT=120
          while [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" != "1" ]; do
            WAIT_TIMEOUT=$((WAIT_TIMEOUT-1))
            if [ $WAIT_TIMEOUT -eq 0 ]; then
              echo "ERROR: Android emulator failed to become fully ready in time!"
              exit 1
            fi
            sleep 1
          done
          echo "Android system is ready!"
          
          echo "Finding APK..."
          export ACTUAL_APK_PATH=$(find "$GITHUB_WORKSPACE" -name "*debug.apk" | head -n 1)
          if [ -z "$ACTUAL_APK_PATH" ]; then
            export ACTUAL_APK_PATH=$(find "$GITHUB_WORKSPACE" -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $ACTUAL_APK_PATH"
          
          if [ -z "$ACTUAL_APK_PATH" ]; then
            echo "APK not found! Failing build."
            exit 1
          fi
          
          echo "Executing Maven E2E Test Suite..."
          cd automation
          sed -i 's/\r$//' ./mvnw 2>/dev/null || true
          chmod +x ./mvnw || true
          ./mvnw clean test -Dapk.path="$ACTUAL_APK_PATH" -Dappium.url="http://127.0.0.1:4723" -DdeviceName="emulator-5554" -Dudid="emulator-5554" || mvn clean test -Dapk.path="$ACTUAL_APK_PATH" -Dappium.url="http://127.0.0.1:4723" -DdeviceName="emulator-5554" -Dudid="emulator-5554"
          
          # Generate 300-case report
          cd ..
          python appium-tests/generate_appium_csv.py
          EOF
          chmod +x run_tests_all.sh

      - name: 12. Boot Android Emulator & Run Appium Tests
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 25
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          emulator-boot-timeout: 600
          disable-animations: true
          script: ./run_tests_all.sh

      # --- Upload all generated Excel/CSV reports ---
      - name: 13. Upload All Test Summary Excel Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: All-Tests-Summary-Reports
          path: |
            selenium-tests/Test_Summary_Report.csv
            appium-tests/Appium_Test_Summary_Report.csv
            Vulnerability Test Results/findings.csv
            Vulnerability Test Results/endpoint-inventory.csv
            Vulnerability Test Results/dependency-vulnerabilities.csv
            Vulnerability Test Results/risk-summary.csv
            Vulnerability Test Results/Load_Test_Summary_Report.csv
            appium.log
          retention-days: 30
          if-no-files-found: ignore
