name: Deploy Test Reports to GitHub Pages

on:
  workflow_run:
    workflows: ["Android Appium E2E Automation"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy-reports:
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0
        continue-on-error: true

      - name: Create gh-pages branch if not exists
        run: |
          git checkout gh-pages 2>/dev/null || git checkout --orphan gh-pages
          mkdir -p reports/latest reports/history

      - name: Download Latest Artifacts
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: android-e2e.yml
          name: e2e-test-results-*
          path: ./downloaded-artifacts
        continue-on-error: true

      - name: Update Reports
        run: |
          BUILD_NUM=${{ github.event.workflow_run.run_number || github.run_number }}
          TIMESTAMP=$(date -u '+%Y-%m-%d_%H-%M-%S')

          # Archive current latest to history
          if [ -d "reports/latest" ] && [ "$(ls -A reports/latest 2>/dev/null)" ]; then
            PREV_BUILD=$(cat reports/latest/.build_number 2>/dev/null || echo "unknown")
            mkdir -p "reports/history/build-${PREV_BUILD}"
            cp -r reports/latest/* "reports/history/build-${PREV_BUILD}/" 2>/dev/null || true
          fi

          # Deploy new latest
          mkdir -p reports/latest
          if [ -d "downloaded-artifacts" ]; then
            cp -r downloaded-artifacts/test-results/HTML/* reports/latest/ 2>/dev/null || true
            mkdir -p reports/latest/screenshots reports/latest/logs
            cp -r downloaded-artifacts/test-results/Screenshots/* reports/latest/screenshots/ 2>/dev/null || true
            cp -r downloaded-artifacts/test-results/Logs/* reports/latest/logs/ 2>/dev/null || true
            cp downloaded-artifacts/test-results/Summary/summary.md reports/latest/ 2>/dev/null || true
          fi

          echo "$BUILD_NUM" > reports/latest/.build_number

          # Create index
          cat > index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>FarmConnect AI - Test Reports Portal</title>
            <style>
              *{margin:0;padding:0;box-sizing:border-box}
              body{font-family:'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center}
              .container{text-align:center;padding:3rem}
              h1{font-size:2.5rem;color:#10b981;margin-bottom:1rem}
              p{color:#94a3b8;margin-bottom:2rem;font-size:1.1rem}
              .links{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
              a{display:inline-block;padding:1rem 2rem;background:linear-gradient(135deg,#065f46,#064e3b);color:#10b981;text-decoration:none;border-radius:12px;font-weight:600;border:1px solid #10b981;transition:all 0.3s}
              a:hover{background:#10b981;color:#0f172a;transform:translateY(-2px)}
            </style>
          </head>
          <body>
            <div class="container">
              <h1>🌾 FarmConnect AI</h1>
              <p>Enterprise E2E Automation Test Reports</p>
              <div class="links">
                <a href="reports/latest/execution-report.html">📊 Latest Execution Report</a>
                <a href="reports/latest/dashboard.html">📋 Dashboard</a>
                <a href="reports/latest/trends.html">📈 Trends</a>
              </div>
            </div>
          </body>
          </html>
          EOF

          echo "Reports updated for build $BUILD_NUM"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          keep_files: true
          exclude_assets: '.github'
