name: React JS Web Selenium E2E Automation

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-web-e2e:
    name: Selenium WebDriver React Web E2E (300 Test Cases)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'selenium-tests/package.json'

      - name: 🌐 3. Setup Google Chrome & Chromedriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 📦 4. Install Dependencies
        working-directory: selenium-tests
        run: |
          npm ci || npm install

      - name: 🧪 5. Execute Selenium E2E Test Suite
        working-directory: selenium-tests
        run: |
          npm test || true

      - name: 📊 6. Generate 300-Test Excel Report
        working-directory: selenium-tests
        run: |
          node generate_excel.js

      - name: 📤 7. Upload React JS Web E2E Excel Report (300 Tests)
        uses: actions/upload-artifact@v4
        with:
          name: React_JS_Web_E2E_Report_300Tests
          path: selenium-tests/reports/React_JS_Web_E2E_Report.xlsx
          retention-days: 14
