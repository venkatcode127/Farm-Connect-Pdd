name: Security Review & SAST

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    name: Security Assessment
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Detect Backend Technology
        id: detect
        run: |
          echo "Detecting backend technology..."
          if [ -f "backend/requirements.txt" ]; then
            echo "BACKEND=python" >> $GITHUB_ENV
            echo "Detected: Python/FastAPI backend"
          elif [ -f "package.json" ]; then
            echo "BACKEND=node" >> $GITHUB_ENV
            echo "Detected: Node.js backend"
          else
            echo "BACKEND=unknown" >> $GITHUB_ENV
            echo "Backend technology undetected"
          fi

      - name: 3. Setup Python
        if: env.BACKEND == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. Python Dependency Audit (pip-audit)
        if: env.BACKEND == 'python'
        run: |
          pip install pip-audit safety
          cd backend
          pip install -r requirements.txt || true
          echo "=== pip-audit Results ===" >> $GITHUB_STEP_SUMMARY
          pip-audit -r requirements.txt --format markdown >> $GITHUB_STEP_SUMMARY || echo "pip-audit found vulnerabilities" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: 5. Secret Detection with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: 6. Semgrep SAST Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/security-audit
            p/owasp-top-ten
            p/javascript
            p/secrets
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true

      - name: 7. Hardcoded Secrets Detection (manual grep)
        run: |
          echo "## 🔍 Hardcoded Secret Scan" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          echo "=== Checking for hardcoded passwords ===" 
          grep -rn "password\s*=\s*['\"][^'\"]*['\"]" --include="*.js" --include="*.py" . | grep -v ".git" | grep -v "node_modules" || echo "None found"
          
          echo "=== Checking for API keys ==="
          grep -rn "api_key\|apikey\|API_KEY" --include="*.js" --include="*.py" . | grep -v ".git" | grep -v "node_modules" || echo "None found"
          
          echo "=== Checking for MongoDB connection strings ==="
          grep -rn "mongodb+srv://" --include="*.py" --include="*.js" --include="*.env" . | grep -v ".git" || echo "None found"
          
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: 8. CORS and Authentication Check
        run: |
          echo "## 🔐 Security Configuration Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check for missing auth dependencies
          if grep -q "allow_origins.*\*" backend/main.py 2>/dev/null; then
            echo "⚠️ CORS wildcard origin detected" >> $GITHUB_STEP_SUMMARY
          fi
          
          if ! grep -q "Authorization\|Bearer\|JWT\|token" backend/main.py 2>/dev/null; then
            echo "❌ No JWT/Token authentication found in backend/main.py" >> $GITHUB_STEP_SUMMARY
          fi
          
          if grep -q "password.*!=\|!= .*password" backend/main.py 2>/dev/null; then
            echo "❌ CRITICAL: Plaintext password comparison detected!" >> $GITHUB_STEP_SUMMARY
          fi
          
          if grep -q "debug/clear\|delete_many" backend/main.py 2>/dev/null; then
            echo "❌ CRITICAL: Dangerous debug/delete endpoint detected in production code!" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: 9. Generate Security Summary
        run: |
          echo "## 📊 Security Assessment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          
          grep -q "password.*!=\|!= .*password" backend/main.py && \
            echo "| Plaintext Password Comparison | ❌ CRITICAL |" >> $GITHUB_STEP_SUMMARY || \
            echo "| Plaintext Password Comparison | ✅ OK |" >> $GITHUB_STEP_SUMMARY
          
          grep -q "mongodb+srv://" backend/.env && \
            echo "| DB Credentials in .env | ❌ CRITICAL |" >> $GITHUB_STEP_SUMMARY || \
            echo "| DB Credentials in .env | ✅ OK |" >> $GITHUB_STEP_SUMMARY
          
          grep -q "ADMIN_PASSWORD\|ADMIN_PHONE" auth.js && \
            echo "| Hardcoded Admin Credentials | ❌ CRITICAL |" >> $GITHUB_STEP_SUMMARY || \
            echo "| Hardcoded Admin Credentials | ✅ OK |" >> $GITHUB_STEP_SUMMARY
          
          grep -q "docs_url=None" backend/main.py && \
            echo "| Swagger UI Disabled | ✅ OK |" >> $GITHUB_STEP_SUMMARY || \
            echo "| Swagger UI Disabled | ⚠️ Exposed |" >> $GITHUB_STEP_SUMMARY

      - name: 10. Fail on Critical Security Violations
        run: |
          CRITICAL_FAILURES=0
          
          # Fail if plaintext password comparison found
          if grep -q "password.*!=\|!= .*password" backend/main.py; then
            echo "::error file=backend/main.py::CRITICAL: Plaintext password comparison detected!"
            CRITICAL_FAILURES=$((CRITICAL_FAILURES + 1))
          fi
          
          # Fail if hardcoded admin credentials in JS
          if grep -q "ADMIN_PASSWORD" auth.js; then
            echo "::error file=auth.js::CRITICAL: Hardcoded admin password in client-side JavaScript!"
            CRITICAL_FAILURES=$((CRITICAL_FAILURES + 1))
          fi
          
          # Fail if MongoDB credentials in .env
          if grep -q "mongodb+srv://.*:.*@" backend/.env 2>/dev/null; then
            echo "::error file=backend/.env::CRITICAL: MongoDB credentials with password found in .env file!"
            CRITICAL_FAILURES=$((CRITICAL_FAILURES + 1))
          fi
          
          if [ $CRITICAL_FAILURES -gt 0 ]; then
            echo "::error::$CRITICAL_FAILURES critical security violation(s) found. Fix before merging!"
            exit 1
          fi
          
          echo "No critical violations found."

      - name: 11. Upload Security Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Security-Reports
          path: |
            Vulnerability Test Results/
            semgrep-results.sarif
          retention-days: 30
          if-no-files-found: ignore
