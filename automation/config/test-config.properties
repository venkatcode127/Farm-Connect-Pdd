# FarmConnect AI - Test Configuration
# =====================================

# Environment
environment=ci
app.name=FarmConnect AI
app.version=1.0.0
app.package=com.farmconnect.ai.debug
app.activity=com.farmconnect.ai.MainActivity

# Appium Server
appium.host=127.0.0.1
appium.port=4723
appium.url=http://127.0.0.1:4723

# Device Configuration
device.name=emulator-5554
device.platform=Android
device.version=14
device.udid=emulator-5554

# APK Configuration
apk.path=../android-app/app/build/outputs/apk/debug/app-debug.apk

# Automation Configuration
automation.name=UiAutomator2
automation.timeout.implicit=15
automation.timeout.explicit=30
automation.timeout.page.load=60

# Test Data - Admin Credentials
test.admin.phone=9347815378
test.admin.password=FARMERuse9347@

# Test Data - Test User
test.user.phone=9876543210
test.user.password=test1234
test.user.name=Test Farmer
test.user.role=farmer
test.user.location=Hyderabad, Telangana

# Retry Configuration
retry.max=2
retry.delay=3000

# Screenshot Configuration
screenshot.on.failure=true
screenshot.on.pass=false
screenshot.dir=test-output/screenshots

# Report Configuration
report.dir=test-output/reports
report.excel.dir=test-output/reports/Excel
report.html.dir=test-output/reports/HTML
report.json.dir=test-output/reports/JSON
report.summary.dir=test-output/reports/Summary

# Logging
log.dir=test-output/logs
log.level=INFO
